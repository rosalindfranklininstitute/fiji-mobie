name: Build Fiji-MoBIE container image and publish to Quay.io

on:
  workflow_dispatch:
    inputs:
      latest:
        description: Also set the latest tag
        type: boolean
        default: false

jobs:
  build-container:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      IMAGE: quay.io/rosalindfranklininstitute/fiji-mobie
    steps:
      - uses: actions/checkout@v6

      - name: Get build date and timestamp
        id: time
        run: |
          {
            echo "tag=$(date -u +%Y%m%d)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.0

      - name: Build and push Fiji-MoBIE image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.time.outputs.tag }}
            ${{ inputs.latest && format('{0}:latest', env.IMAGE) || '' }}
          build-args: |
            IMAGE_VERSION=${{ steps.time.outputs.tag }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.time.outputs.created }}

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-publish.yml@${{ github.ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
